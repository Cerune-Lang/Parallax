name: Parallax differential checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: parallax
      - uses: actions/checkout@v4
        with:
          repository: Cerune-Lang/Cerune
          ref: master
          path: cerune
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build Cerune
        working-directory: cerune
        run: cargo build --locked --bin cerune
      - name: Test comparison oracle
        run: python3 -m unittest discover -s parallax/tests -v
      - name: Compare execution routes
        run: python3 parallax/scripts/differential.py --binary cerune/target/debug/cerune --cases parallax/cases
      - name: Deterministic arithmetic campaign
        run: python3 parallax/scripts/seeded.py --binary cerune/target/debug/cerune --corpus parallax/corpus/seeds.json --count 4 --budget 8 --out-dir parallax/.parallax-findings
      - name: Bounded expression-tree campaign
        run: python3 parallax/scripts/expressions.py --binary cerune/target/debug/cerune --corpus parallax/corpus/seeds.json --count 3 --depth 2 --budget 8 --out-dir parallax/.parallax-findings/expressions
      - name: Bounded control-flow campaign
        run: python3 parallax/scripts/control_flow.py --binary cerune/target/debug/cerune --corpus parallax/corpus/seeds.json --count 4 --depth 2 --budget 8 --out-dir parallax/.parallax-findings/flow
      - name: Cerune-generated arithmetic inputs
        run: python3 parallax/scripts/cerune_generator.py --binary cerune/target/debug/cerune --generator parallax/cerune/generate.ceru
      - name: Cerune-generated nested arithmetic
        run: python3 parallax/scripts/cerune_nested.py --binary cerune/target/debug/cerune --generator parallax/cerune/generate_nested.ceru
      - name: Cerune-generated short-circuit cases
        run: python3 parallax/scripts/cerune_flow.py --binary cerune/target/debug/cerune --generator parallax/cerune/generate_flow.ceru
